name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Package APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(ls app/build/outputs/apk/github/debug/*.apk | head -n 1)
          DEST="beam-finder-github-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Beam Finder ${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Beam Finder ${{ steps.apk.outputs.version }}

            - Detect controls grouped into Sensitivity / Locks / Actions / Advanced panels
            - Guide-line drag stays clear of the system shade at the top edge
            - Menu refresh + remove unused detection-area width setting

            If you are on an earlier build: About → Check for update.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
